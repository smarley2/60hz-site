    <path d="M282 221 C417 184 550 187 657 218 C770 251 839 308 841 366 C843 428 773 472 696 479 C607 487 536 458 505 416" stroke="#a8ddff" stroke-width="13" opacity=".9"/>

    <!-- top swirl -->
    <path d="M386 35 C469 -5 584 3 648 60 C704 111 695 188 640 222 C589 253 519 230 504 183 C490 142 530 105 573 112 C609 118 622 151 606 174" stroke="#0074df" stroke-width="42" opacity=".95"/>
    <path d="M424 45 C497 19 577 28 620 72 C660 112 649 166 611 188 C575 208 531 190 526 158 C522 133 547 116 570 123" stroke="#48b3ff" stroke-width="23" opacity=".96"/>
    <path d="M458 51 C515 39 565 50 593 80 C619 109 609 145 584 158 C562 169 540 158 539 140" stroke="#c6eaff" stroke-width="10" opacity=".9"/>

    <!-- lower curl -->
    <path d="M432 548 C538 614 690 636 815 591 C927 552 978 473 949 410 C922 352 841 335 783 369 C730 400 722 458 760 486 C795 512 844 493 850 458" stroke="#004cba" stroke-width="51" opacity=".96"/>
    <path d="M454 529 C556 586 682 597 786 562 C879 531 921 473 899 426 C878 384 822 374 784 397 C750 418 747 452 773 469" stroke="#0088f4" stroke-width="31" opacity=".98"/>
    <path d="M489 513 C579 558 676 563 754 539 C819 520 851 485 838 456 C826 431 793 425 772 439" stroke="#7bcaff" stroke-width="17" opacity=".92"/>

    <!-- golden energy sweep -->
    <path d="M259 472 C410 415 533 416 647 458 C752 496 859 493 974 434" stroke="#ffc100" stroke-width="27" opacity=".98"/>
    <path d="M300 438 C435 391 547 396 648 433 C748 469 842 462 938 414" stroke="#ffe05a" stroke-width="13" opacity=".96"/>
    <path d="M590 150 C721 117 841 135 945 201 C1019 248 1062 306 1084 368" stroke="#ffc100" stroke-width="22" opacity=".96"/>
    <path d="M632 181 C744 158 840 178 922 229 C982 266 1014 310 1036 353" stroke="#fff0a1" stroke-width="10" opacity=".92"/>
    <path d="M747 84 C842 107 928 153 1008 226" stroke="#ffc100" stroke-width="17" opacity=".96"/>

    <!-- light blue arcs bleeding into white -->
    <path d="M120 262 C258 192 393 178 517 211" stroke="#86d1ff" stroke-width="30" opacity=".8"/>
    <path d="M72 323 C236 251 378 246 501 281" stroke="#b6e5ff" stroke-width="18" opacity=".8"/>
    <path d="M118 386 C252 334 368 337 474 369" stroke="#e0f4ff" stroke-width="11" opacity=".92"/>
  </g>

  <!-- short impasto marks -->
  <g fill="none" stroke-linecap="round" opacity=".92">
    <path d="M260 88 l52 -17 M329 69 l35 -8 M713 45 l45 11 M812 70 l39 15 M913 119 l44 25 M984 166 l30 20 M911 616 l47 -20 M800 664 l38 -8 M676 693 l49 -3" stroke="#ffc100" stroke-width="11"/>

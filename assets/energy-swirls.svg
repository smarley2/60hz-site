<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
  <title id="title">Movimento de energia em azul e amarelo</title>
  <desc id="desc">Composição abstrata original com pinceladas curvas e movimento, nas cores da 60Hz.</desc>
  <defs>
    <filter id="brush" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.055" numOctaves="2" seed="23" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="11" xChannelSelector="R" yChannelSelector="B"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffc100" stop-opacity=".34"/>
      <stop offset="1" stop-color="#ffc100" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="720" cy="350" r="250" fill="url(#glow)" filter="url(#soft)"/>


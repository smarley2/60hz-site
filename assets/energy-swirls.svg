<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
  <title id="title">Pinceladas de energia em azul e amarelo</title>
  <desc id="desc">Composição abstrata original com pinceladas expressivas nas cores da 60Hz.</desc>
  <defs>
    <filter id="rough" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.045" numOctaves="2" seed="31" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="B"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <radialGradient id="warm" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffc100" stop-opacity=".34"/>
      <stop offset="1" stop-color="#ffc100" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="690" cy="330" r="230" fill="url(#warm)" filter="url(#soft)"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)">
    <!-- outer movement -->
    <path d="M170 83 C360 -15 640 18 858 125 C1032 210 1111 363 1060 514 C1005 675 790 747 566 693 C355 643 251 536 263 423" stroke="#005ac7" stroke-width="70" opacity=".95"/>
    <path d="M145 119 C342 29 608 53 818 145 C993 222 1076 349 1034 478 C989 620 806 699 610 669 C418 640 290 550 292 444" stroke="#0078e8" stroke-width="48" opacity=".96"/>
    <path d="M172 160 C354 87 581 98 760 164 C927 225 1014 332 989 438 C961 553 820 628 660 620 C487 611 360 541 345 458" stroke="#0090ff" stroke-width="33" opacity=".98"/>
